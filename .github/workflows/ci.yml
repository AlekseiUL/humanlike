name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"

    steps:
      - name: Check out complete branch history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.12.8"

      - name: Install locked development environment
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest -q

      - name: Run lint
        run: uv run ruff check .

      - name: Check release privacy
        run: uv run python scripts/privacy_gate.py .

      - name: Build wheel and source archive
        env:
          SOURCE_DATE_EPOCH: "1767225600"
        run: uv build --no-build-isolation

      - name: Smoke-test the installed wheel
        if: runner.os != 'Windows'
        run: |
          python -m venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/humanlike route --locale en --text "Rewrite this paragraph in a neutral tone."
          .wheel-smoke/bin/humanlike eval
          .wheel-smoke/bin/humanlike doctor --config examples/hermes-humanlike/humanlike.toml

      - name: Smoke-test the installed wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .wheel-smoke
          uv pip install --python .wheel-smoke\Scripts\python.exe (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          .\.wheel-smoke\Scripts\humanlike.exe route --locale en --text "Rewrite this paragraph in a neutral tone."
          .\.wheel-smoke\Scripts\humanlike.exe eval
          .\.wheel-smoke\Scripts\humanlike.exe doctor --config examples\hermes-humanlike\humanlike.toml
