[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "humanlike-agent-kit"
dynamic = ["version"]
description = "Provider-neutral behavioral runtime for humanlike AI agents."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
humanlike = "humanlike_agent.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "setuptools==84.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanlike_agent = [
    "data/evals/*.jsonl",
    "data/foundation/*.json",
]

[tool.setuptools.dynamic]
version = { attr = "humanlike_agent.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
