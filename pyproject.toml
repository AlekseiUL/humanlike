[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "humanlike-agent-kit"
dynamic = ["version"]
description = "Provider-neutral behavioral runtime for humanlike AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [
    { name = "Aleksei Ulyanov" },
]
keywords = ["ai-agents", "behavior", "hermes-agent", "privacy", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
humanlike = "humanlike_agent.cli:main"

[project.entry-points."hermes_agent.plugins"]
humanlike-agent-kit = "humanlike_agent.hermes_plugin"

[project.urls]
Homepage = "https://github.com/AlekseiUL/humanlike"
Repository = "https://github.com/AlekseiUL/humanlike"
Issues = "https://github.com/AlekseiUL/humanlike/issues"
Documentation = "https://github.com/AlekseiUL/humanlike#readme"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "setuptools==84.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanlike_agent = [
    "data/evals/*.jsonl",
    "data/foundation/*.json",
]

[tool.setuptools.dynamic]
version = { attr = "humanlike_agent.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
